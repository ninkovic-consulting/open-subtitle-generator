name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and why the current behaviour does not help.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like OSG to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
